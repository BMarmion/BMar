name: Purchase Intelligence - Rapport hebdo

on:
  schedule:
    - cron: "0 7 * * 0"
  workflow_dispatch:

jobs:
  weekly-price-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Check prices
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: |
          cd procurement
          python tracker.py --all

      - name: Save price history
        run: |
          git config user.name "price-bot"
          git config user.email "bot@noreply"
          git add procurement/data/*/price_history.json || true
          git diff --cached --quiet || git commit -m "prix $(date +%Y-%m-%d)"
          git push || echo "nothing to push"
